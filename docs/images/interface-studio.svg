<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">DevPilot AI Interface Studio preview</title><desc id="desc">Illustrative interface showing live workspace preview and saved accent color and density controls.</desc>
  <rect width="1280" height="760" rx="18" fill="#f7f7fa"/><rect x="0" y="0" width="1280" height="62" fill="#fff"/><path d="M0 62h1280" stroke="#e7e7ed"/><text x="44" y="38" fill="#686875" font-family="Arial" font-size="13">← Back to workspace</text><circle cx="633" cy="31" r="12" fill="#b6afea"/><text x="654" y="36" fill="#43434d" font-family="Arial" font-size="14" font-weight="700">Interface Studio</text><circle cx="1170" cy="31" r="5" fill="#79caa0"/><text x="1184" y="36" fill="#777783" font-family="Arial" font-size="11">Changes saved</text>
  <text x="274" y="112" fill="#7464e8" font-family="Arial" font-size="18">✦</text><text x="302" y="111" fill="#5e5e68" font-family="Arial" font-size="14">Change the workspace accent and spacing. The preview updates immediately.</text>
  <rect x="274" y="143" width="732" height="276" rx="14" fill="#fff" stroke="#e1e1e7"/><rect x="274" y="143" width="188" height="276" rx="14" fill="#fff"/><path d="M462 143v276" stroke="#e9e9ee"/><text x="298" y="178" fill="#282832" font-family="Arial" font-size="14" font-weight="700">&lt;/&gt; devpilot<tspan fill="#3978d4">.ai</tspan></text><rect x="291" y="201" width="154" height="35" rx="6" fill="#edf2fb"/><text x="307" y="224" fill="#3978d4" font-family="Arial" font-size="11">▦  Repository scan</text><text x="307" y="260" fill="#686875" font-family="Arial" font-size="11">⚙  Interface Studio</text><text x="487" y="183" fill="#858391" font-family="Arial" font-size="9" letter-spacing="1.3">DEVPILOT AI / LOCAL SCAN</text><text x="487" y="220" fill="#292832" font-family="Arial" font-size="23" font-weight="700">Repository analysis</text><text x="487" y="244" fill="#797987" font-family="Arial" font-size="12">Describe your problem and find related code in your repository.</text><rect x="487" y="264" width="489" height="125" rx="8" fill="#fff" stroke="#e5e5eb"/><text x="506" y="291" fill="#30303a" font-family="Arial" font-size="12" font-weight="700">What problem are you trying to solve?</text><rect x="506" y="307" width="300" height="38" rx="5" fill="#fff" stroke="#e6e6eb"/><text x="517" y="331" fill="#9998a3" font-family="Arial" font-size="10">Describe the behavior you expected…</text><rect x="816" y="307" width="141" height="38" rx="6" fill="#3978d4"/><text x="886" y="331" fill="#fff" font-family="Arial" font-size="10" text-anchor="middle">Find related code →</text>
  <rect x="274" y="443" width="732" height="112" rx="11" fill="#fff" stroke="#e5e5eb"/><text x="299" y="476" fill="#30303a" font-family="Arial" font-size="14" font-weight="700">Workspace accent</text><text x="299" y="498" fill="#888894" font-family="Arial" font-size="11">Choose the highlight color used for active controls and actions.</text><circle cx="316" cy="529" r="8" fill="#7464e8"/><text x="331" y="533" fill="#555560" font-family="Arial" font-size="11">Violet</text><rect x="392" y="511" width="89" height="36" rx="7" fill="#fff" stroke="#3978d4" stroke-width="2"/><circle cx="410" cy="529" r="8" fill="#3978d4"/><text x="425" y="533" fill="#3978d4" font-family="Arial" font-size="11">Blue ✓</text><circle cx="509" cy="529" r="8" fill="#26876e"/><text x="524" y="533" fill="#555560" font-family="Arial" font-size="11">Green</text><circle cx="600" cy="529" r="8" fill="#c2517b"/><text x="615" y="533" fill="#555560" font-family="Arial" font-size="11">Rose</text>
  <rect x="274" y="571" width="732" height="107" rx="11" fill="#fff" stroke="#e5e5eb"/><text x="299" y="604" fill="#30303a" font-family="Arial" font-size="14" font-weight="700">Workspace spacing</text><text x="299" y="626" fill="#888894" font-family="Arial" font-size="11">Choose how much space appears around navigation and panels.</text><rect x="299" y="642" width="330" height="24" rx="5" fill="#fff" stroke="#e4e4e9"/><text x="313" y="658" fill="#666670" font-family="Arial" font-size="10">Comfortable · More room between items</text><rect x="640" y="638" width="343" height="32" rx="6" fill="#f3f6fc" stroke="#3978d4" stroke-width="1.5"/><text x="655" y="658" fill="#4c4c56" font-family="Arial" font-size="10" font-weight="700">Compact · Fit more on the screen</text>
