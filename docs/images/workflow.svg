<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">DevPilot AI debugging workflow</title><desc id="desc">Upload a repository, describe the issue, investigate with evidence, review a patch, apply it, and verify it with tests.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11141b"/><stop offset="1" stop-color="#19172b"/></linearGradient><linearGradient id="accent"><stop stop-color="#7464e8"/><stop offset="1" stop-color="#4c8ddb"/></linearGradient></defs>
  <rect width="1280" height="430" rx="22" fill="url(#bg)"/><text x="64" y="68" fill="#aaa3e9" font-family="Segoe UI,Arial" font-size="15" font-weight="700" letter-spacing="2">DEVPILOT AI · CONTROLLED DEBUGGING</text><text x="64" y="111" fill="#f2f2f7" font-family="Segoe UI,Arial" font-size="29" font-weight="700">From a bug report to a reviewed change</text>
  <g font-family="Segoe UI,Arial"><g transform="translate(64 168)"><rect width="330" height="170" rx="15" fill="#1c202a" stroke="#343849"/><circle cx="35" cy="39" r="17" fill="#7464e8"/><text x="35" y="45" fill="white" font-size="16" font-weight="700" text-anchor="middle">1</text><text x="65" y="45" fill="#f2f2f7" font-size="18" font-weight="700">Upload the project</text><text x="25" y="88" fill="#a8adba" font-size="14">Read a bounded ZIP in the browser.</text><text x="25" y="112" fill="#a8adba" font-size="14">Pick a code file; keep README available.</text><text x="25" y="145" fill="#7fc7a0" font-size="12">No uploaded code is executed.</text></g>
  <path d="M410 252h47" stroke="url(#accent)" stroke-width="4"/><path d="m450 244 12 8-12 8" fill="none" stroke="#8f83ef" stroke-width="4"/>
  <g transform="translate(475 168)"><rect width="330" height="170" rx="15" fill="#1c202a" stroke="#343849"/><circle cx="35" cy="39" r="17" fill="#7464e8"/><text x="35" y="45" fill="white" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="65" y="45" fill="#f2f2f7" font-size="18" font-weight="700">Describe the problem</text><text x="25" y="88" fill="#a8adba" font-size="14">Explain expected and actual behavior.</text><text x="25" y="112" fill="#a8adba" font-size="14">Search matching code locally or request AI.</text><text x="25" y="145" fill="#d5bd83" font-size="12">AI requires a configured provider.</text></g>
  <path d="M821 252h47" stroke="url(#accent)" stroke-width="4"/><path d="m861 244 12 8-12 8" fill="none" stroke="#8f83ef" stroke-width="4"/>
  <g transform="translate(886 168)"><rect width="330" height="170" rx="15" fill="#1c202a" stroke="#343849"/><circle cx="35" cy="39" r="17" fill="#7464e8"/><text x="35" y="45" fill="white" font-size="16" font-weight="700" text-anchor="middle">3</text><text x="65" y="45" fill="#f2f2f7" font-size="18" font-weight="700">Review and verify</text><text x="25" y="88" fill="#a8adba" font-size="14">Check evidence and proposed changes.</text><text x="25" y="112" fill="#a8adba" font-size="14">Approve patches; download changed files.</text><text x="25" y="145" fill="#d5bd83" font-size="12">Docker tests are planned, not connected.</text></g></g>
  <text x="64" y="390" fill="#7f8594" font-family="Segoe UI,Arial" font-size="13">The current MVP supports local code search and a provider-backed analysis endpoint; it never claims unrun tests passed.</text>
</svg>
